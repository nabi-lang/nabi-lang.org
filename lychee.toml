# lychee over the built pages (CI). The generator checks every internal
# link itself; this adds the anchors and the links that leave the sites.

include_fragments = "anchor-only"
fallback_extensions = ["html"]
# Pages whose last segment has a dot (a version, an API item) or shares
# its name with a directory (brand/, a module's submodules): lychee takes
# the dot for an extension and the directory for the page, so name the
# .html.
remap = [
    '^(file://.*/(news/nabi-|releases/)\d+\.\d+\.\d+)(#.*)?$ $1.html$3',
    '^(file://.*/public/www(/[a-z-]+)?/brand)(#.*)?$ $1.html$3',
    '^(file://.*/(trait|impl|struct|enum|fn|type|const|static|union|macro|alias)\.[^/#?.]+)(#.*)?$ $1.html$3',
]
# A directory with no index.html is a module whose page sits beside it
# as <name>.html; the generator has checked that link already.
index_files = ["index.html", "."]
max_concurrency = 16
max_retries = 2
timeout = 20
# Rate limits are not broken links.
accept = ["200..=299", "403", "429"]
exclude = [
    # Cloudflare's email address obfuscation is on for the live hosts:
    # it rewrites mailto: links into these, which work only in a browser.
    '/cdn-cgi/l/email-protection',
    '/cdn-cgi/scripts/',
    '^mailto:',
    # The playground reads #src= in the page; it is not an anchor.
    '^https://playground\.nabi-lang\.org/.*#src=',
    # Addresses in code examples.
    '^file:///srv/',
    '^https?://(127\.0\.0\.1|localhost|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+)[:/]',
    # Source links the docs make, at a pinned commit: thousands of them,
    # and github.com answers a share of any such burst with a 502.
    '^https://github\.com/nabi-lang/[^/]+/blob/[0-9a-f]{40}/',
    # Other docs versions: a CI build makes dev/ only.
    '^file://.*/public/docs/(latest|\d+\.\d+(\.\d+)?)(/|$)',
    # Edit links to files a pull request may add.
    '^https://github\.com/nabi-lang/[^/]+/edit/',
]
