<!doctype html>
<html class="nb dk" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../web/css/nabi.css">
<style>
  @font-face { font-family: "Geist Mono"; src: url("../web/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; display: flex; flex-direction: column; padding: 72px 80px; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  .wm { height: 120px; width: auto; align-self: flex-start; margin-left: -14px; }
  h1 { margin: 0 0 auto; padding-top: 40px; font-family: var(--mono); font-size: 64px; line-height: 76px; letter-spacing: -0.04em; font-weight: 600; color: var(--ink); }
  h1 span { color: var(--acc); }
  .ft { display: flex; align-items: center; gap: 18px; font-size: 30px; line-height: 40px; color: var(--ink-3); border-top: 2px solid var(--line-2); padding-top: 32px; }
  .ft b { color: var(--acc); font-weight: 500; }
  .ft span { color: var(--ink); }
  .ft i { margin-left: auto; font-style: normal; }
</style>
</head>
<body>
<div class="og">
  <img class="wm" src="../web/assets/brand/wordmark-dark.svg" alt="">
  <h1>Clear rules,<br><span>free as a butterfly.</span></h1>
  <div class="ft"><b>$</b><span>curl -fsSL https://nabi.sh | sh</span><i>0.1.0</i></div>
</div>
</body>
</html>
