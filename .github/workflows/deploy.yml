# A push to release ships nabi-lang.org, docs.nabi-lang.org and nabi.sh.
# Deploys run in nabi-lang/infra; nothing about them lives here.
name: Deploy / nabi-lang.org

on:
  push:
    branches: [release]

permissions: {}

jobs:
  deploy:
    name: Deploy
    uses: nabi-lang/.github/.github/workflows/reusable-deploy.yml@v1.0.2
    with:
      site: nabi-web
    secrets:
      GH_DISPATCH_TOKEN_INFRA: ${{ secrets.GH_DISPATCH_TOKEN_INFRA }}
